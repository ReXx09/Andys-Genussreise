services:
  kochbuch:
    image: ghcr.io/rexx09/andys-genussreise:latest
    container_name: kochbuch-dashboard
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-1900}:3000"
    environment:
      - PORT=3000
      - DB_PATH=/data/database.sqlite
      - KOCHBUCH_ADMIN_PASSWORD=${KOCHBUCH_ADMIN_PASSWORD}
      - AUTH_SESSION_TTL_HOURS=${AUTH_SESSION_TTL_HOURS:-24}
    volumes:
      - ${DATA_DIR:-/mnt/user/appdata/andys-kochbuch}:/data
    working_dir: /app/server
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
