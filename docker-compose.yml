services:
  kochbuch:
    image: ghcr.io/rexx09/andys-genussreise:latest
    container_name: kochbuch-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-1900}:${PORT:-1900}"
    environment:
      - PORT=${PORT:-1900}
      - DB_PATH=/data/database.sqlite
      - AUTH_SESSION_TTL_HOURS=${AUTH_SESSION_TTL_HOURS:-24}
    volumes:
      - kochbuch-data:/data
      - /app/server/node_modules
    working_dir: /app/server

volumes:
  kochbuch-data:
